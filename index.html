<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 공영주차장 찾기</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:#f5f6f8;color:#222}.container{max-width:900px;margin:30px auto;padding:0 20px}.header{margin-bottom:30px}.header h1{margin-bottom:8px;font-size:32px}.header p{margin:0;color:#666}.box{background:white;border-radius:12px;padding:25px;margin-bottom:25px;box-shadow:0 2px 8px rgba(0,0,0,.08)}#searchInput{width:100%;padding:14px 16px;font-size:17px;border:1px solid #ccc;border-radius:8px;outline:none}#searchInput:focus{border-color:#1a73e8}#loading{margin-top:12px;color:#777}#count{margin-top:15px;font-weight:bold}table{width:100%;border-collapse:collapse}th{background:#f1f3f5;padding:13px;border-bottom:2px solid #ddd}td{padding:13px;text-align:center;border-bottom:1px solid #eee}tr:hover{background:#fafafa}.view-button{border:none;background:#1a73e8;color:white;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold}.view-button:hover{background:#1557b0}.pagination{display:flex;justify-content:center;gap:6px;margin-top:20px;flex-wrap:wrap}.page-button{min-width:38px;padding:8px 10px;border:1px solid #ccc;background:white;border-radius:6px;cursor:pointer}.page-button.active{background:#1a73e8;color:white;border-color:#1a73e8;font-weight:bold}.page-button:disabled{opacity:.45;cursor:default}.parking-title{display:flex;justify-content:space-between;align-items:center}.parking-title h3{margin:0;font-size:24px}.parking-code{margin-top:5px;color:#777;font-size:14px}.parking-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}.stat-card{background:#f5f6f8;padding:20px;text-align:center;border-radius:10px}.stat-title{color:#666;font-size:14px}.stat-value{margin-top:8px;font-size:28px;font-weight:bold}.status{display:inline-block;padding:7px 15px;border-radius:20px;font-weight:bold}.status-good{color:#087f23;background:#dff5e5}.status-normal{color:#776000;background:#fff6bf}.status-busy{color:#a15c00;background:#ffe6bd}.status-full{color:#b00020;background:#ffe0e5}.detail-row{margin-top:20px;line-height:1.8;color:#555}.empty-message{text-align:center;padding:25px;color:#777}#map{width:100%;height:400px;border-radius:10px}.map-info{margin-top:18px;padding:18px;background:#f7f8fa;border-radius:10px;line-height:1.7}.map-place-name{font-size:18px;font-weight:bold;margin-bottom:5px}.map-address{color:#555;margin-bottom:12px}.map-link{display:inline-block;text-decoration:none;background:#fee500;color:#111;padding:9px 15px;border-radius:7px;font-weight:bold}@media(max-width:650px){.parking-stats{grid-template-columns:1fr}.header h1{font-size:26px}th,td{padding:9px;font-size:14px}}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🅿️ 부산 공영주차장 찾기</h1>
    <p>부산 공영주차장의 실시간 주차 가능 정보와 위치를 확인할 수 있습니다.</p>
  </div>

  <div class="box">
    <h2>주차장 검색</h2>
    <input type="text" id="searchInput" placeholder="예: 장산, 화명, 해운대" oninput="searchParking()">
    <div id="loading">주차장 데이터를 불러오는 중입니다...</div>
    <div id="count"></div>
  </div>

  <div class="box">
    <table>
      <thead><tr><th>코드</th><th>주차장명</th><th>실시간 정보</th></tr></thead>
      <tbody id="parkingList"></tbody>
    </table>
    <div id="pagination" class="pagination"></div>
  </div>

  <h2>실시간 주차정보</h2>
  <div class="box" id="parkingInfo"><div class="empty-message">위 목록에서 조회할 주차장을 선택하세요.</div></div>

  <h2>주차장 위치</h2>
  <div class="box">
    <div id="map"></div>
    <div id="mapInfo" class="map-info">주차장을 조회하면 지도에서 위치를 찾아 표시합니다.</div>
  </div>
</div>

<!-- 본인의 카카오 JavaScript 키로 변경 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=292bb037bc225c181e9130c33279e93b&libraries=services"></script>
<script>
const PAGE_SIZE=10;
let allParkingList=[],filteredParkingList=[],currentPage=1;
let map,marker,infowindow;

window.addEventListener("DOMContentLoaded",()=>{initMap();getAllParkingList();});

function initMap(){map=new kakao.maps.Map(document.getElementById("map"),{center:new kakao.maps.LatLng(35.1796,129.0756),level:8});}

async function getAllParkingList(){
  try{
    const response=await fetch("/api/parking-list");
    if(!response.ok) throw new Error("목록 API 오류 : HTTP "+response.status);
    const data=await response.json();
    allParkingList=Array.isArray(data.items)?data.items:[];
    filteredParkingList=[...allParkingList];currentPage=1;
    document.getElementById("loading").textContent="";
    renderParkingList();
  }catch(error){console.error(error);document.getElementById("loading").textContent="주차장 데이터를 가져오지 못했습니다.";}
}

function searchParking(){
  if(allParkingList.length===0)return;
  const keyword=document.getElementById("searchInput").value.trim();
  filteredParkingList=keyword===""?[...allParkingList]:allParkingList.filter(p=>p.parknm.includes(keyword));
  currentPage=1;renderParkingList();
}

function renderParkingList(){
  const total=filteredParkingList.length;
  const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));
  if(currentPage>totalPages) currentPage=totalPages;
  const start=(currentPage-1)*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,total);
  const pageItems=filteredParkingList.slice(start,end);
  document.getElementById("count").textContent=total===0?"검색된 주차장 : 0개":`검색된 주차장 : ${total}개 · ${start+1}~${end}번째 표시`;
  document.getElementById("parkingList").innerHTML=pageItems.length===0?`<tr><td colspan="3"><div class="empty-message">검색 결과가 없습니다.</div></td></tr>`:pageItems.map(p=>`<tr><td>${p.parkgcd}</td><td>${p.parknm}</td><td><button class="view-button" onclick="getParkingInfo('${p.parkgcd}')">조회</button></td></tr>`).join("");
  renderPagination(totalPages,total);
}

function renderPagination(totalPages,totalItems){
  const el=document.getElementById("pagination");
  if(totalItems===0||totalPages<=1){el.innerHTML="";return;}
  let html=`<button class="page-button" onclick="goToPage(${currentPage-1})" ${currentPage===1?"disabled":""}>이전</button>`;
  for(let p=1;p<=totalPages;p++) html+=`<button class="page-button ${p===currentPage?"active":""}" onclick="goToPage(${p})">${p}</button>`;
  html+=`<button class="page-button" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>다음</button>`;
  el.innerHTML=html;
}

function goToPage(page){
  const totalPages=Math.ceil(filteredParkingList.length/PAGE_SIZE);
  if(page<1||page>totalPages)return;
  currentPage=page;renderParkingList();
  window.scrollTo({top:document.getElementById("count").offsetTop-30,behavior:"smooth"});
}

async function getParkingInfo(code){
  try{
    document.getElementById("parkingInfo").innerHTML=`<div class="empty-message">실시간 주차정보를 불러오는 중입니다...</div>`;
    const response=await fetch("/api/parking-info?code="+encodeURIComponent(code));
    if(!response.ok) throw new Error("실시간 API 오류 : HTTP "+response.status);
    const data=await response.json(),parking=data.item;
    if(!parking) throw new Error("주차정보가 없습니다.");
    const max=Number(parking.maxcnt),parkingCount=Number(parking.parkingcnt),available=Number(parking.curravacnt);
    const rate=max>0?(available/max)*100:0;
    let status,statusClass;
    if(available===0){status="만차";statusClass="status-full";}
    else if(rate<=20){status="혼잡";statusClass="status-busy";}
    else if(rate<=40){status="보통";statusClass="status-normal";}
    else{status="여유";statusClass="status-good";}

    document.getElementById("parkingInfo").innerHTML=`
      <div class="parking-title"><div><h3>${parking.parknm}</h3><div class="parking-code">주차장 코드 : ${parking.parkgcd}</div></div><span class="status ${statusClass}">${status}</span></div>
      <div class="parking-stats">
        <div class="stat-card"><div class="stat-title">전체 주차면</div><div class="stat-value">${max}</div></div>
        <div class="stat-card"><div class="stat-title">현재 주차</div><div class="stat-value">${parkingCount}</div></div>
        <div class="stat-card"><div class="stat-title">주차 가능</div><div class="stat-value">${available}</div></div>
      </div>
      <div class="detail-row">주차 가능 비율 : <strong>${rate.toFixed(1)}%</strong><br>최종 갱신 : ${parking.lastupdatetime}</div>`;
    findParkingOnMap(parking.parknm,available,status);
  }catch(error){console.error(error);document.getElementById("parkingInfo").innerHTML=`<div class="empty-message">실시간 주차정보를 가져오지 못했습니다.</div>`;}
}

function findParkingOnMap(name,available,status){
  const places=new kakao.maps.services.Places();
  const keywords=[`부산 ${name} 공영주차장`,`부산 ${name} 주차장`,`부산 ${name}`];
  searchPlace(places,keywords,0,name,available,status);
}

function searchPlace(places,keywords,index,name,available,status){
  if(index>=keywords.length){document.getElementById("mapInfo").textContent="지도에서 해당 주차장 위치를 찾지 못했습니다.";return;}
  places.keywordSearch(keywords[index],(result,s)=>{
    if(s===kakao.maps.services.Status.OK&&result.length>0) showPlace(result[0],name,available,status);
    else searchPlace(places,keywords,index+1,name,available,status);
  });
}

function showPlace(place,name,available,status){
  const position=new kakao.maps.LatLng(place.y,place.x);map.setCenter(position);map.setLevel(3);
  if(marker)marker.setMap(null);marker=new kakao.maps.Marker({position});marker.setMap(map);
  if(infowindow)infowindow.close();
  infowindow=new kakao.maps.InfoWindow({content:`<div style="padding:10px;min-width:190px;line-height:1.5;font-size:14px"><strong>${name}</strong><br>주차 가능 : ${available}대<br>상태 : ${status}</div>`});
  infowindow.open(map,marker);
  const address=place.road_address_name||place.address_name||"주소 정보 없음";
  document.getElementById("mapInfo").innerHTML=`<div class="map-place-name">📍 ${place.place_name}</div><div class="map-address">${address}</div><div>검색한 주차장 : <strong>${name}</strong></div><br><a class="map-link" href="${place.place_url||"#"}" target="_blank" rel="noopener noreferrer">카카오맵에서 크게 보기</a>`;
}
</script>
</body>
</html>
